context:
  version: "0.2.0"

package:
  name: spaday-fluent
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-fluent/spaday_fluent-${{ version }}.tar.gz
  sha256: a02af6001053b48fc0a84794f18f148d45f661deae58bf0fc027e7199407fece

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.10.0,<1

tests:
  - python:
      imports:
        - spaday_fluent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Fluent components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-fluent
  repository: https://github.com/1kbgz/spaday-fluent

extra:
  recipe-maintainers:
    - timkpaine
